name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      # The bench shows what the integration computes: its engine draws the demonstration views.
      - uses: actions/checkout@v4
        with:
          repository: Niakman13/niak-weather-integration
          path: integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          NIAK_INTEGRATION: ${{ github.workspace }}/integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-parity
          path: test-results/
